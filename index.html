<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANNAH PHARMACY - Dawa za Uhakika, Huduma ya Upendo</title>
    <link href="/css/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .portal-title {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body class="bg-emerald-50">

    <!-- Header -->
    <header class="bg-gradient-to-r from-teal-700 to-teal-800 text-white py-6 shadow-lg">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="text-5xl">💊</div>
                    <div>
                        <h1 class="portal-title">HANNAH PHARMACY</h1>
                        <p class="text-teal-100 text-lg -mt-1">Dawa za Uhakika • Huduma ya Upendo</p>
                    </div>
                </div>

                <div class="relative">
                    <button onclick="toggleMenu()" class="text-4xl hover:text-teal-200 transition-colors">⋮</button>
                    <div id="navDropdown" class="hidden absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-xl py-3 z-50 border border-gray-100 text-gray-700">
                        <a href="#" class="block px-6 py-3 hover:bg-teal-50">🏠 Mwanzo</a>
                        <a href="#" class="block px-6 py-3 hover:bg-teal-50">💊 Dawa Zetu</a>
                        <a href="#" class="block px-6 py-3 hover:bg-teal-50">❓ Maswali Yanayoulizwa</a>
                        <a href="#" class="block px-6 py-3 hover:bg-teal-50">📞 Wasiliana Nasi</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-10">
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-8 rounded-3xl mb-10">
            <h2 class="text-2xl font-bold mb-3">AGIZA DAWA HARAKA AU TUMA CHETI CHA DAKTARI</h2>
            <p>Weka oda yako au tuma picha ya cheti cha daktari ili upate huduma haraka.</p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar and Main Content (same as before) -->
            <!-- ... paste the rest of your content here ... -->
        </div>
    </div>

    <script>
        // Your existing script remains the same
        function toggleMenu() {
            document.getElementById("navDropdown").classList.toggle("hidden");
        }

        function showContent(contentId, element) {
            document.querySelectorAll('.page-content-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(contentId).classList.remove('hidden');

            document.querySelectorAll('.sidebar-menu li').forEach(li => {
                li.classList.remove('bg-teal-50', 'text-teal-700', 'font-medium');
            });
            element.classList.add('bg-teal-50', 'text-teal-700', 'font-medium');
        }

        document.addEventListener('DOMContentLoaded', () => {
            showContent('catalog-content', document.getElementById('menu-catalog'));
        });
    </script>
</body>
</html>
